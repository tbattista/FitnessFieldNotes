<!DOCTYPE html>
<html
  lang="en"
  class="layout-menu-fixed layout-compact"
  data-assets-path="/static/assets/"
  data-template="vertical-menu-template-free">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{ title }} | Fitness Field Notes</title>
    <meta name="description" content="{{ description }}" />
    <link rel="canonical" href="{{ canonical }}" />
    {% if robots %}<meta name="robots" content="{{ robots }}" />{% endif %}

    <meta property="og:type" content="{{ og_type or 'website' }}" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="{{ description }}" />
    <meta name="twitter:image" content="{{ base_url }}/static/assets/img/og-image.png" />

    {% for block in json_ld %}

    {% endfor %}

    <link rel="icon" type="image/svg+xml" href="/static/assets/img/favicon/favicon.svg" />

    <link rel="stylesheet" href="/static/assets/css/ffn-custom.css" />
    <link rel="stylesheet" href="/static/assets/css/components.css?v=20260216" />
    <link rel="stylesheet" href="/static/assets/css/navbar-custom.css" />
    <link rel="stylesheet" href="/static/assets/css/global-log-fab.css" />
    <link rel="stylesheet" href="/static/assets/css/design-system.css" />

            <main class="container-xxl flex-grow-1 container-p-y wl-main">
              {% block content %}{% endblock %}

        </div>
