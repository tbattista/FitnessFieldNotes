<a class="wl-card" href="{{ c.url }}">
  <span class="wl-card-meta">
    <span class="wl-pill">{{ c.minutes }} min</span>
    <span class="wl-pill wl-pill-muted">{{ c.category }}</span>
  </span>
  <span class="wl-card-title">{{ c.title }}</span>
  <span class="wl-card-summary">{{ c.summary }}</span>
</a>
